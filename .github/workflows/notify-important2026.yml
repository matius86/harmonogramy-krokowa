name: Check Important 2026 RAW

on:
  schedule:
    - cron: "*/1 * * * *"   # co minutę

jobs:
  check-raw:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Pobierz lokalny hash
        id: local
        run: |
          LOCAL_HASH=$(sha256sum data/important_2026.json | awk '{print $1}')
          echo "local_hash=$LOCAL_HASH" >> $GITHUB_OUTPUT

      - name: Pobierz remote hash
        id: remote
        run: |
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/data/important_2026.json"
          REMOTE_HASH=$(curl -s "$RAW_URL?nocache=$(date +%s)" | sha256sum | awk '{print $1}')
          echo "remote_hash=$REMOTE_HASH" >> $GITHUB_OUTPUT

      - name: Porównaj hashe
        if: steps.local.outputs.local_hash != steps.remote.outputs.remote_hash
        run: |
          echo "🔄 Wykryto nową wersję RAW — wysyłam powiadomienie"

          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: key=${{ secrets.FCM_SERVER_KEY }}" \
            -d '{
              "to": "/topics/zmiany2026",
              "data": { "refresh": "true" },
              "notification": {
                "title": "Aktualizacja informacji",
                "body": "Zaktualizowano ważne informacje na 2026 rok."
              }
            }' \
            https://fcm.googleapis.com/fcm/send

      - name: Brak zmian
        if: steps.local.outputs.local_hash == steps.remote.outputs.remote_hash
        run: |
          echo "⏳ RAW nadal stary — czekam do następnej minuty"
