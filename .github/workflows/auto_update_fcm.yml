name: Auto-update updated_at + FCM Push

on:
  push:
    branches:
      - main

jobs:
  update-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install jq -y

      - name: Update updated_at field
        run: |
          NOW=$(date +"%Y-%m-%d %H:%M")
          jq --arg now "$NOW" '.updated_at = $now' data/important_2026.json > tmp.json
          mv tmp.json data/important_2026.json

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/important_2026.json
          git commit -m "Auto-update updated_at to $NOW" || echo "No changes to commit"
          git push

      - name: Generate OAuth2 token
        id: token
        run: |
          echo "${{ secrets.FCM_SERVICE_ACCOUNT }}" > service_account.json

          jq -r .private_key service_account.json > private_key.pem
          chmod 600 private_key.pem

          HEADER=$(echo -n '{"alg":"RS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')

          NOW=$(date +%s)
          EXP=$((NOW + 3600))

          CLIENT_EMAIL=$(jq -r .client_email service_account.json)

          CLAIM=$(cat <<EOF
{
  "iss": "$CLIENT_EMAIL",
  "scope": "https://www.googleapis.com/auth/firebase.messaging",
  "aud": "https://oauth2.googleapis.com/token",
  "iat": $NOW,
  "exp": $EXP
}
EOF
)

          PAYLOAD=$(echo -n "$CLAIM" | openssl base64 -A | tr '+/' '-_' | tr -d '=')

          SIGNING_INPUT="$HEADER.$PAYLOAD"

          SIGNATURE=$(echo -n "$SIGNING_INPUT" | \
            openssl dgst -sha256 -sign private_key.pem | \
            openssl base64 -A | tr '+/' '-_' | tr -d '=')

          JWT="$HEADER.$PAYLOAD.$SIGNATURE"

          ACCESS_TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=$JWT" \
            https://oauth2.googleapis.com/token | jq -r '.access_token')

          echo "token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Send FCM push
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json; UTF-8" \
            -d '{
              "message": {
                "topic": "zmiany2026",
                "notification": {
                  "title": "Zmiany 2026",
                  "body": "Dodano nową informację"
                }
              }
            }' \
            https://fcm.googleapis.com/v1/projects/zmiany2026/messages:send
