name: Auto-update updated_at

on:
  push:
    branches:
      - main

jobs:
  update-timestamp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'   # ⭐ KONKRETNA WERSJA

      - name: Install jq
        run: sudo apt-get install jq -y

      - name: Update updated_at field
        run: |
          NOW=$(date +"%Y-%m-%d %H:%M")
          jq --arg now "$NOW" '.updated_at = $now' important2026.json > tmp.json
          mv tmp.json important2026.json

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add important2026.json
          git commit -m "Auto-update updated_at to $NOW" || echo "No changes to commit"
          git push
