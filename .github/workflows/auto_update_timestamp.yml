name: Auto-update updated_at

on:
  push:
    branches:
      - main

jobs:
  update-timestamp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Install jq
        run: sudo apt-get install jq -y

      - name: Update updated_at field
        run: |
          NOW=$(date +"%Y-%m-%d %H:%M")
          echo "NOW=$NOW" >> $GITHUB_ENV
          jq --arg now "$NOW" '.updated_at = $now' data/important_2026.json > tmp.json
          mv tmp.json data/important_2026.json

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add data/important_2026.json
          git commit -m "Auto-update updated_at to $NOW" || echo "No changes to commit"

          git pull --rebase origin main
          git push
